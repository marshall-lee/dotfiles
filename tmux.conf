# How to read this file.
#
# Options: set -g sets a global option, -s a server one, -w (or setw) a window
# one and -p a pane one. -a appends to the value, -u unsets it. Options named
# @something are this file's own variables.
#
# Formats, used in option values and by if -F:
#   #{?cond,a,b}       a if cond is neither empty nor 0, else b
#   #{==:a,b}          1 if a and b are equal, else 0. Also #{&&:a,b},
#                      #{||:a,b} and #{!:a}: and, or, not
#   #{m/r:re,s}        1 if the regular expression re matches s
#   #{s|re|repl|:var}  var with re replaced by repl. Several of these, joined
#                      by ;, run one after another
#   #{b:var}           the last part of the path in var
#   #{=/24/…:var}      var cut to 24 characters, ending in … when it's cut
#   #{@opt}            the option @opt's value as is. #{E:@opt} expands the
#                      formats in it too
#   #S #I #W #T        the session name, window number, window name and pane
#                      title
#   #[fg=…,bg=…]       the colors for the text after it
# The regular expressions are POSIX extended ones, so there's no (?:...) and no
# named groups.
#
# Commands: bind -n binds a key that works without the prefix, bind -T one in
# that key table, like copy-mode-vi. send -X runs a copy mode command, send -M
# passes a mouse event on to the pane. if -F checks a format. { ... } groups
# commands, and \; separates them.

# Ctrl+Space is the prefix, instead of Ctrl+B.
set -g prefix C-Space
set -g mouse on
# tmux sets the terminal's title, to the current pane's title, like
# ~/code/dotfiles from zsh. The tabs already show the session and window.
set -g set-titles on
set -g set-titles-string '#T'
# Solarized Osaka, from craftzdog/solarized-osaka.nvim extras/tmux. mode-style
# is for copy mode and lists like the session tree, message-style for messages
# and the command prompt, message-command-style for the prompt in vi's normal
# mode.
set -g mode-style fg=#268bd3,bg=#063540
set -g message-style fg=#268bd3,bg=#063540
set -g message-command-style fg=#268bd3,bg=#063540
set -g pane-border-style fg=#063540
# The current pane's border is yellow in copy mode, blue otherwise.
set -g pane-active-border-style '#{?pane_in_mode,fg=#b28500,fg=#268bd3}'
# Status bar on top, windows drawn as square tabs. The current tab has the
# terminal's background, so it looks attached to the pane below. Icons and the
# rounded pill edges are Nerd Font glyphs.
set -g status on
set -g status-position top
# Redraw the bar every second, so the tab names below keep up.
set -g status-interval 1
set -g status-style fg=#839496,bg=#002c38
# Room for a longer session name: the default is 10 columns.
set -g status-left-length 40
# Windows count from 1, like the Cmd+1 ... Cmd+9 shortcuts, and closing one
# renumbers the rest.
set -g base-index 1
set -g renumber-windows on
# Shells are named after their directory (~ for home), Neovim after its file
# (it sets the title, see nvim/lua/config/title.lua), everything else after its
# command, plus the subcommand for some (@re_subcmd_cmds).
# The home directory, shown as ~.
set -g @home "$HOME"
# zsh titles the pane "<dir>: <command line>" while a command runs (see
# zsh/init/90-prompt.zsh). tmux itself only sees the process group leader
# without its arguments, and that's a shell for a zsh function or a script
# wrapper, or an interpreter for a script like irb. So the command comes from
# the title. In
#   (host) myapp: ( FOO="a b" docker/rails s; )
# everything before docker/rails matches @re_before_cmd, built from these.
# (host): when ssh'd into the machine this zsh runs on.
set -g @re_host '([(][^)]*[)] )?'
# myapp: the folder's name. Unlike the title at the prompt, ~/code/myapp, it
# has no /.
set -g @re_dir '[^/:]*: '
# ( or {: a subshell or a command group.
set -g @re_group '([({] )*'
# A word mixes "...", '...', \ escapes and plain characters. tmux keeps a \ in a
# title as \\, so an escaped character is [\][\] and that character, which can
# be a [\][\] too.
set -g @re_dquoted '"[^"]*"'
set -g @re_squoted "'[^']*'"
set -g @re_escaped '[\][\]([\][\]|.)'
set -g @re_plain "[^ \"'\\;]"
set -g @re_word '(#{@re_dquoted}|#{@re_squoted}|#{@re_escaped}|#{@re_plain})*'
# FOO="a b"
set -g @re_assign '[A-Za-z_][A-Za-z0-9_]*=#{E:@re_word} '
set -g @re_before_cmd '^#{@re_host}#{@re_dir}#{@re_group}(#{E:@re_assign})*'
# After @re_before_cmd, the command and the options before its subcommand, like
# git -C dir. -C and -c take a value.
set -g @re_opt '(-[Cc] #{E:@re_word}|-#{E:@re_word})'
set -g @re_before_sub '^#{E:@re_word}( #{E:@re_opt})* ?'
# The arguments, from the first space or the ; that ends a ( ... ) or { ... }.
set -g @re_args '[ ;].*'
# The command is what's left without @re_before_cmd, @re_args and the
# directory: rails. The subcommand is what's left without @re_before_cmd,
# @re_before_sub and @re_args: s. The regexes are options because a ; or :
# written inside an s|...| would end it.
set -g @title_cmd '#{s|#{E:@re_before_cmd}||;s|#{@re_args}||;s|.*/||:pane_title}'
set -g @title_sub '#{s|#{E:@re_before_cmd}||;s|#{E:@re_before_sub}||;s|#{@re_args}||:pane_title}'
# Commands named with their subcommand, like git diff or rails c.
set -g @re_subcmd_cmds '^(git|rails)$'
# The title names the command when tmux sees a shell or an interpreter, or the
# same program. Otherwise it's from somewhere else, like the host ssh is
# connected to.
set -g @re_runner '^(zsh|bash|fish|sh|ruby|[Pp]ython.*|node|perl)$'
# @tab_from_title is 1 when the title is zsh's and names the command, as above.
set -g @tab_from_title '#{&&:#{m/r:#{E:@re_before_cmd},#{pane_title}},#{||:#{m/r:#{@re_runner},#{pane_current_command}},#{==:#{E:@title_cmd},#{pane_current_command}}}}'
# The command running in the pane, empty at a shell prompt, and its subcommand.
# Without a title to go by, the command is what tmux sees, and there's no
# subcommand.
set -g @tab_cmd '#{?#{E:@tab_from_title},#{E:@title_cmd},#{?#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}},,#{pane_current_command}}}'
set -g @tab_sub '#{?#{&&:#{E:@tab_from_title},#{m/r:#{@re_subcmd_cmds},#{E:@tab_cmd}}},#{E:@title_sub},}'
# The tab's name: nvim's title cut to 24 characters, the command with its
# subcommand, or at a shell prompt the directory's name (~ for home).
set -g automatic-rename-format '#{?#{E:@tab_cmd},#{?#{==:#{E:@tab_cmd},nvim},#{=/24/…:pane_title},#{E:@tab_cmd}#{?#{E:@tab_sub}, #{E:@tab_sub},}},#{?#{==:#{pane_current_path},#{@home}},~,#{b:pane_current_path}}}'
# Tabs compute the name on every redraw. tmux's own renaming waits for the pane
# to print something, so a quiet command like sleep would keep the old name.
# Tabs renamed by hand turn automatic-rename off and keep their name.
set -g @tab_name '#{?automatic-rename,#{E:automatic-rename-format},#W}'
# Session pill: blue, yellow while the prefix is pressed, green in copy mode.
set -g @accent '#{?client_prefix,#b28500,#{?pane_in_mode,#859900,#268bd3}}'
# Glyphs make its rounded ends and the icon before the session name.
set -g status-left '#[fg=#{E:@accent}]#[fg=#001419,bg=#{E:@accent},bold] #S #[fg=#{E:@accent},bg=#002c38,nobold] '
# Tab icon for the command running in the window, a folder at a shell prompt.
# An icon can have its own color, like Ruby's red on the current tab: the tab
# formats set the tab's color back after it. Each line opens a #{?cond,icon,
# and the last one closes them all, so they read as if, else if, ..., else.
set -g  @tab_icon '#{?#{==:#{E:@tab_cmd},nvim},,'
set -ga @tab_icon '#{?#{m/r:^vim?$,#{E:@tab_cmd}},,'
set -ga @tab_icon '#{?#{==:#{E:@tab_cmd},ssh},󰣀,'
set -ga @tab_icon '#{?#{m/r:^(git|lazygit|tig)$,#{E:@tab_cmd}},,'
set -ga @tab_icon '#{?#{m/r:^(node|npm|npx)$,#{E:@tab_cmd}},,'
set -ga @tab_icon '#{?#{m/r:^(ruby|irb|pry|rails|rake|bundle|srb|rubocop)$,#{E:@tab_cmd}},#{?window_active,#[fg=#dc322f],},'
set -ga @tab_icon '#{?#{m/r:^python,#{E:@tab_cmd}},,'
set -ga @tab_icon '#{?#{==:#{E:@tab_cmd},claude},󰚩,'
set -ga @tab_icon '#{?#{E:@tab_cmd},,}}}}}}}}}'
# After the name: an icon while a pane is zoomed, a red bell after a bell.
set -g @tab_flags '#{?window_zoomed_flag, 󰊓,}#{?window_bell_flag, #[fg=#dc322f],}'
# The tabs pad themselves, so there's no separator between them.
set -g window-status-separator ''
# tmux 3.8 underlines the current tab by default.
set -g window-status-current-style default
# A tab: its number, icon, name and flags, then a gap in the bar's color. The
# current tab is bold and darker, with a yellow number and a blue name.
set -g window-status-format '#[fg=#586e75,bg=#063540] #I #[fg=#839496]#{E:@tab_icon}#[fg=#839496] #{E:@tab_name}#{E:@tab_flags} #[bg=#002c38] '
set -g window-status-current-format '#[fg=#b28500,bg=#001a1d,bold] #I #[fg=#268bd3]#{E:@tab_icon}#[fg=#268bd3] #{E:@tab_name}#{E:@tab_flags} #[bg=#002c38,nobold] '
# The host the current pane is ssh'ed into, set by zsh/init/41-tmux.zsh, shown
# on the right while there is one.
set -g @ssh_pill '#[fg=#6c71c4]#[fg=#001419,bg=#6c71c4,bold]󰣀 #{@ssh_host} #[fg=#6c71c4,bg=#002c38,nobold]'
set -g status-right '#{?#{@ssh_host},#{E:@ssh_pill},}'
# Let apps like Neovim know when the terminal gains or loses focus.
set -g focus-events on
# Let apps that ask for it tell keys like Ctrl+Tab from plain Tab.
set -s extended-keys on
# Wait only 10 ms after Esc for the rest of a key sequence, so Esc is instant
# in Neovim and zsh's vi mode.
set -s escape-time 10
# Alacritty can show hyperlinks and underline styles and colors, so tmux passes
# them on.
set -as terminal-features 'alacritty*:hyperlinks:usstyle'
# vi keys in copy mode, but on the Norman layout's keys for h, j, k and l: y, n,
# i and o. p searches again, as n does. zsh/init/22-key-bindings.zsh maps the
# same way.
setw -g mode-keys vi
bind -T copy-mode-vi y send -X cursor-left
bind -T copy-mode-vi o send -X cursor-right
bind -T copy-mode-vi n send -X cursor-down
bind -T copy-mode-vi i send -X cursor-up
bind -T copy-mode-vi p send -X search-again
# Prefix bindings: splits open in the pane's directory, r reloads this file,
# and q closes the pane instead of showing pane numbers.
bind % split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"
bind q kill-pane
# Cmd shortcuts (Super on Linux). tmux can't see the Cmd key, so Alacritty sends
# each one as "\e[<key code>;<1 + modifiers>~" (Shift 1, Alt 2, Super 8) and
# user-keys names them User0, User1 and so on. A CSI u ending won't do: tmux
# parses that itself and turns Super into Alt.
# Cmd+T new tab, Cmd+Opt+O / Cmd+Opt+Y next / previous tab.
set -s user-keys[0] "\e[116;9~"
set -s user-keys[1] "\e[111;11~"
set -s user-keys[2] "\e[121;11~"
bind -n User0 new-window -c '#{pane_current_path}'
bind -n User1 next-window
bind -n User2 previous-window
# Cmd+E / Cmd+Shift+E split right / down, Cmd+W close the pane.
set -s user-keys[3] "\e[101;9~"
set -s user-keys[4] "\e[101;10~"
set -s user-keys[5] "\e[119;9~"
bind -n User3 split-window -h -c '#{pane_current_path}'
bind -n User4 split-window -v -c '#{pane_current_path}'
bind -n User5 kill-pane
# Cmd+Y / Cmd+N / Cmd+I / Cmd+O: pane to the left / below / above / right.
set -s user-keys[6] "\e[121;9~"
set -s user-keys[7] "\e[110;9~"
set -s user-keys[8] "\e[105;9~"
set -s user-keys[9] "\e[111;9~"
bind -n User6 select-pane -L
bind -n User7 select-pane -D
bind -n User8 select-pane -U
bind -n User9 select-pane -R
# Cmd+F: search the scrollback.
set -s user-keys[10] "\e[102;9~"
bind -n User10 copy-mode \; command-prompt -T search -p "(search up)" { send-keys -X search-backward "%%" }
# Cmd+1 ... Cmd+8 go to that tab, Cmd+9 to the last one.
set -s user-keys[11] "\e[49;9~"
set -s user-keys[12] "\e[50;9~"
set -s user-keys[13] "\e[51;9~"
set -s user-keys[14] "\e[52;9~"
set -s user-keys[15] "\e[53;9~"
set -s user-keys[16] "\e[54;9~"
set -s user-keys[17] "\e[55;9~"
set -s user-keys[18] "\e[56;9~"
set -s user-keys[19] "\e[57;9~"
bind -n User11 select-window -t :1
bind -n User12 select-window -t :2
bind -n User13 select-window -t :3
bind -n User14 select-window -t :4
bind -n User15 select-window -t :5
bind -n User16 select-window -t :6
bind -n User17 select-window -t :7
bind -n User18 select-window -t :8
bind -n User19 select-window -t '{end}'
# Ctrl+Tab / Ctrl+Shift+Tab: next / previous tab. Alacritty sends them as CSI u.
bind -n C-Tab next-window
bind -n C-BTab previous-window
# The wheel scrolls the scrollback in copy mode, unless the pane runs a
# full-screen app or one that asked for the mouse, like Neovim: then the app
# gets the wheel.
set -g @wheel_to_app '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}'
bind -n WheelUpPane if -F '#{E:@wheel_to_app}' { send -M } { copy-mode }
bind -n WheelDownPane if -F '#{E:@wheel_to_app}' { send -M } { copy-mode }
# Copy mode entered by a mouse selection sets @mouse_copy on the pane; leaving
# copy mode clears it. c uses it to decide whether to exit copy mode after
# copying.
set-hook -g pane-mode-changed { if -F '#{!:#{pane_in_mode}}' { set -pu @mouse_copy } }
# Mouse only selects; copy explicitly with c. By default, letting go of a drag
# copies and leaves copy mode.
unbind -T copy-mode-vi MouseDragEnd1Pane
# In copy mode, a double click selects a word and a triple click a line.
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line
# Outside it, a drag or a double or triple click enters copy mode and selects,
# unless the pane is in copy mode already or its app asked for the mouse: then
# they get the click. -t = is the clicked pane, copy-mode -M starts a drag and
# -H hides the position indicator.
bind -n MouseDrag1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -M; set -p @mouse_copy 1 }
bind -n DoubleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H; set -p @mouse_copy 1; send -X select-word }
bind -n TripleClick1Pane select-pane -t = \; if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { copy-mode -H; set -p @mouse_copy 1; send -X select-line }
# Copy and flash the selection green. Then leave copy mode if a mouse selection
# entered it, otherwise just clear the selection. The selection style is applied
# when the selection changes, so rectangle-toggle twice forces a repaint.
bind -T copy-mode-vi c if -F '#{selection_present}' {
  send -X copy-pipe-no-clear
  set -w copy-mode-selection-style bg=green,fg=black

  # This force the selection redraw.
  send -X rectangle-toggle
  send -X rectangle-toggle

  # Keep the green for a tenth of a second.
  run -d 0.1
  set -uw copy-mode-selection-style
  if -F '#{@mouse_copy}' { send -X cancel } { send -X clear-selection }
}

# Ctrl+I: Alacritty sends it as "\e[105;5u", so it isn't Tab (both are ^I
# otherwise), and this hands that on to the pane. zsh binds it to
# up-line-or-beginning-search, see zsh/init/22-key-bindings.zsh.
bind-key -n C-i send-keys "\e[105;5u"
