name: Iosevka

on:
  push:
    branches: [master]
    paths:
      - iosevka/**
      - .github/workflows/iosevka.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build fonts
        run: make -C iosevka build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          iosevka=$(sed -n 's/^ARG IOSEVKA_VERSION=//p' iosevka/Dockerfile)
          nerd_fonts=$(sed -n 's/^ARG NERD_FONTS_VERSION=//p' iosevka/Dockerfile)
          sha=${GITHUB_SHA::7}
          (cd iosevka/dist && zip ../IosevkaTermSS06X.zip *.ttf)
          gh release create "iosevka-v$iosevka-$sha" iosevka/IosevkaTermSS06X.zip iosevka/dist/*.ttf \
            --target "$GITHUB_SHA" \
            --title "Iosevka Term SS06X $iosevka ($sha)" \
            --notes "Iosevka $iosevka (SS06, Term spacing, Extended width, SemiBold as Bold) patched with Nerd Fonts $nerd_fonts (Mono). Install with \`make -C iosevka download install\`, or unzip into ~/Library/Fonts."
